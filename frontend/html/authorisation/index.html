<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" href="./register/icons/reg-icon.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./register/styles/root.css" />
  <link rel="stylesheet" href="./register/styles/style.css" />
</head>

<body>
  <header></header>
  <main>
    <!-- Background layers -->
    <div class="bg-img"></div>
    <div class="orb orb-teal"></div>
    <div class="orb orb-purple"></div>
    <div class="orb orb-blue"></div>

    <svg class="grid-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse">
          <path d="M60 0L0 0 0 60" fill="none" stroke="#00e5b4" stroke-width=".6" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#g)" />
    </svg>

    <!-- Main page -->
    <div class="page">
      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-icon">
          <img src="./register/images/logo.png" alt="" width="40" height="40" />
        </div>
        <div class="logo-title">Название</div>
        <div class="logo-sub">Авторизация</div>
      </div>

      <!-- Card -->
      <div class="card">

        <div class="tabs">
          <button class="tab-btn active" data-tab="register">
            Регистрация
          </button>
          <button class="tab-btn" data-tab="login">Вход</button>
        </div>

        <!-- Forms -->
        <div class="form-body">
          <!-- Панель регистрации -->
          <div class="form-panel active" id="panel-register">
            <form onsubmit="return false;">
              <div class="form-group">
                <label class="form-label">Логин</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                      <circle cx="12" cy="7" r="4" />
                    </svg>
                  </span>
                  <input class="form-input" type="text" placeholder="Введите ваш логин" />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Электронная почта</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <rect x="2" y="4" width="20" height="16" rx="2" />
                      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                    </svg>
                  </span>
                  <input class="form-input" type="email" placeholder="hero@arena.ru" />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Пароль</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <rect x="3" y="11" width="18" height="11" rx="2" />
                      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                  </span>
                  <input class="form-input" type="password" id="reg-pass" placeholder="Минимум 8 символов" />
                  <button type="button" class="input-eye" onclick="togglePass('reg-pass', this)">
                    <svg class="eye-off" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                      viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Подтверждение пароля</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    </svg>
                  </span>
                  <input class="form-input" type="password" id="reg-confirm" placeholder="Повторите пароль" />
                  <button type="button" class="input-eye" onclick="togglePass('reg-confirm', this)">
                    <svg class="eye-off" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                      viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
              </div>

              <label class="check-label">
                <input type="checkbox" checked />
                <div class="check-box">
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                    <path d="M2 5l2.5 2.5L8 2.5" stroke="#0f0c1a" stroke-width="1.8" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </div>
                <span class="check-text">
                  Я соглашаюсь с <a href="#">политикой конфиденциальности</a>
                </span>
              </label>

              <button type="submit" class="btn-primary">
                Регистрация →
              </button>

              <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">или войти через</span>
                <div class="divider-line"></div>
              </div>

              <div class="socials">
                <button type="button" class="btn-social">
                  <svg width="16" height="16" viewBox="0 0 24 24">
                    <path fill="#EA4335"
                      d="M5.266 9.765A7.077 7.077 0 0 1 12 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3C17.782 1.145 15.055 0 12 0 7.27 0 3.198 2.698 1.24 6.65l4.026 3.115Z" />
                    <path fill="#34A853"
                      d="M16.04 18.013c-1.09.703-2.474 1.078-4.04 1.078a7.077 7.077 0 0 1-6.723-4.823l-4.04 3.067A11.965 11.965 0 0 0 12 24c2.933 0 5.735-1.043 7.834-3l-3.793-2.987Z" />
                    <path fill="#4A90D9"
                      d="M19.834 21c2.195-2.048 3.62-5.096 3.62-9 0-.71-.109-1.473-.272-2.182H12v4.637h6.436c-.317 1.559-1.17 2.766-2.395 3.558L19.834 21Z" />
                    <path fill="#FBBC05"
                      d="M5.277 14.268A7.12 7.12 0 0 1 4.909 12c0-.782.125-1.533.357-2.235L1.24 6.65A11.934 11.934 0 0 0 0 12c0 1.92.445 3.73 1.237 5.335l4.04-3.067Z" />
                  </svg>
                  Google
                </button>
                <button type="button" class="btn-social">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="#4a90d9">
                    <path
                      d="M15.07 2H8.93C3.33 2 2 3.33 2 8.93v6.14C2 20.67 3.33 22 8.93 22h6.14C20.67 22 22 20.67 22 15.07V8.93C22 3.33 20.67 2 15.07 2zm2.88 13.27h-1.64c-.62 0-.81-.5-1.92-1.62-1-.93-1.43-1.05-1.67-1.05-.34 0-.44.1-.44.58v1.48c0 .42-.14.67-1.24.67-1.82 0-3.84-1.1-5.26-3.16C4.5 9.42 4 7.47 4 7.04c0-.23.1-.45.58-.45h1.64c.44 0 .6.2.77.65.83 2.42 2.22 4.54 2.8 4.54.22 0 .31-.1.31-.65V9c-.07-1.17-.68-1.27-.68-1.69 0-.21.17-.42.45-.42h2.58c.37 0 .5.2.5.63v3.4c0 .37.17.5.27.5.22 0 .4-.13.8-.53 1.23-1.38 2.1-3.5 2.1-3.5.12-.23.31-.45.75-.45h1.64c.49 0 .6.25.49.63-.2.94-2.1 3.6-2.1 3.6-.17.27-.23.4 0 .7.17.23.72.7 1.08 1.13.68.77 1.2 1.42 1.34 1.87.14.44-.08.67-.52.67z" />
                  </svg>
                  VK
                </button>
                <button type="button" class="btn-social">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="#5865F2">
                    <path
                      d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" />
                  </svg>
                  Discord
                </button>
              </div>
            </form>
          </div>
          <!-- Панель регистрации -->

          <!-- Панель входа -->
          <div class="form-panel" id="panel-login">
            <form onsubmit="return false;">
              <div class="form-group">
                <label class="form-label">Электронная почта или логин</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                      <circle cx="12" cy="7" r="4" />
                    </svg>
                  </span>
                  <input class="form-input" type="text" placeholder="hero@arena.ru" />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Пароль</label>
                <div class="input-wrap">
                  <span class="input-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <rect x="3" y="11" width="18" height="11" rx="2" />
                      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                  </span>
                  <input class="form-input" type="password" id="login-pass" placeholder="Введите пароль" />
                  <button type="button" class="input-eye" onclick="togglePass('login-pass', this)">
                    <svg class="eye-off" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                      viewBox="0 0 24 24">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="form-meta">
                <label class="remember-label">
                  <input type="checkbox" checked /> Запомнить меня
                </label>
                <a href="#" class="forgot-link">Забыли пароль?</a>
              </div>

              <button type="submit" class="btn-primary">
                Войти в игру →
              </button>

              <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">или войти через</span>
                <div class="divider-line"></div>
              </div>

              <div class="socials">
                <button type="button" class="btn-social">
                  <svg width="16" height="16" viewBox="0 0 24 24">
                    <path fill="#EA4335"
                      d="M5.266 9.765A7.077 7.077 0 0 1 12 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3C17.782 1.145 15.055 0 12 0 7.27 0 3.198 2.698 1.24 6.65l4.026 3.115Z" />
                    <path fill="#34A853"
                      d="M16.04 18.013c-1.09.703-2.474 1.078-4.04 1.078a7.077 7.077 0 0 1-6.723-4.823l-4.04 3.067A11.965 11.965 0 0 0 12 24c2.933 0 5.735-1.043 7.834-3l-3.793-2.987Z" />
                    <path fill="#4A90D9"
                      d="M19.834 21c2.195-2.048 3.62-5.096 3.62-9 0-.71-.109-1.473-.272-2.182H12v4.637h6.436c-.317 1.559-1.17 2.766-2.395 3.558L19.834 21Z" />
                    <path fill="#FBBC05"
                      d="M5.277 14.268A7.12 7.12 0 0 1 4.909 12c0-.782.125-1.533.357-2.235L1.24 6.65A11.934 11.934 0 0 0 0 12c0 1.92.445 3.73 1.237 5.335l4.04-3.067Z" />
                  </svg>
                  Google
                </button>
                <button type="button" class="btn-social">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="#4a90d9">
                    <path
                      d="M15.07 2H8.93C3.33 2 2 3.33 2 8.93v6.14C2 20.67 3.33 22 8.93 22h6.14C20.67 22 22 20.67 22 15.07V8.93C22 3.33 20.67 2 15.07 2zm2.88 13.27h-1.64c-.62 0-.81-.5-1.92-1.62-1-.93-1.43-1.05-1.67-1.05-.34 0-.44.1-.44.58v1.48c0 .42-.14.67-1.24.67-1.82 0-3.84-1.1-5.26-3.16C4.5 9.42 4 7.47 4 7.04c0-.23.1-.45.58-.45h1.64c.44 0 .6.2.77.65.83 2.42 2.22 4.54 2.8 4.54.22 0 .31-.1.31-.65V9c-.07-1.17-.68-1.27-.68-1.69 0-.21.17-.42.45-.42h2.58c.37 0 .5.2.5.63v3.4c0 .37.17.5.27.5.22 0 .4-.13.8-.53 1.23-1.38 2.1-3.5 2.1-3.5.12-.23.31-.45.75-.45h1.64c.49 0 .6.25.49.63-.2.94-2.1 3.6-2.1 3.6-.17.27-.23.4 0 .7.17.23.72.7 1.08 1.13.68.77 1.2 1.42 1.34 1.87.14.44-.08.67-.52.67z" />
                  </svg>
                  VK
                </button>
                <button type="button" class="btn-social">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="#5865F2">
                    <path
                      d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" />
                  </svg>
                  Discord
                </button>
              </div>
            </form>
          </div>
          <!--login panel -->
        </div>
        <!--form-body -->
      </div>
      <!--card-->


    </div>
    <!--page-->
  </main>
  <footer>
    <h3>© 2026 Название · Все права защищены</h3>
  </footer>
  <script src="./register/register.js"></script>
</body>

</html>
